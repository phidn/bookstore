<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Ivory background matching brand -->
  <rect width="32" height="32" rx="6" fill="#f5f0e8"/>
  <!-- Pavilion roof top knob -->
  <circle cx="16" cy="4.5" r="1.2" fill="#111111"/>
  <!-- Upper roof sweeping eaves -->
  <path d="M8.5 8.5 Q16 5.5 23.5 8.5" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Lower roof sweeping eaves -->
  <path d="M6 12.2 Q16 9 26 12.2" fill="none" stroke="#111111" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Pavilion body columns -->
  <rect x="12.5" y="12.5" width="1.5" height="7" rx="0.4" fill="#111111"/>
  <rect x="18" y="12.5" width="1.5" height="7" rx="0.4" fill="#111111"/>
  <!-- Arch door -->
  <path d="M14 19.5 v-3.5 a2 2 0 0 1 4 0 v3.5" fill="none" stroke="#111111" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Open book base - left page -->
  <path d="M8 20 Q12 19.5 16 20.5" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M8 20 L9 25.5 Q12 25 16 26" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Open book base - right page -->
  <path d="M24 20 Q20 19.5 16 20.5" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M24 20 L23 25.5 Q20 25 16 26" fill="none" stroke="#111111" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Red seal TH -->
  <rect x="22.5" y="22" width="7" height="7" rx="1.2" fill="#8b1a1a"/>
  <text x="23.2" y="27.5" font-size="5.5" fill="white" font-family="serif" font-weight="bold">TH</text>
</svg>
