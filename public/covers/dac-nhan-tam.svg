<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="g_dac-nhan-tam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <filter id="f_dac-nhan-tam" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#g_dac-nhan-tam)"/>
  <!-- Book Spine highlight -->
  <rect x="0" y="0" width="16" height="600" fill="#ffffff" opacity="0.08"/>
  <line x1="20" y1="0" x2="20" y2="600" stroke="#000000" stroke-width="1.5" opacity="0.4"/>
  <!-- Inner Border Frame -->
  <rect x="36" y="36" width="528" height="528" fill="none" stroke="#f5d0fe" stroke-width="1.5" opacity="0.4" rx="6"/>
  <rect x="46" y="46" width="508" height="508" fill="none" stroke="#f5d0fe" stroke-width="0.75" opacity="0.2" rx="4"/>
  
  <!-- Category Tag -->
  <g transform="translate(300, 110)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#f5d0fe" fill-opacity="0.15" stroke="#f5d0fe" stroke-width="1" stroke-opacity="0.4"/>
    <text text-anchor="middle" y="5" fill="#f5d0fe" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">KỸ NĂNG</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="240" text-anchor="middle" fill="#ffffff" font-family="Georgia, Cambria, serif" font-size="30" font-weight="bold" letter-spacing="-0.5">
    Đắc Nhân Tâm
  </text>
  <text x="300" y="280" text-anchor="middle" fill="#f5d0fe" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-style="italic" letter-spacing="0.5" opacity="0.9">
    How to Win Friends
  </text>

  <!-- Decorative Divider -->
  <line x1="220" y1="330" x2="380" y2="330" stroke="#f5d0fe" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="330" r="3.5" fill="#f5d0fe"/>

  <!-- Author -->
  <text x="300" y="380" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" letter-spacing="1">
    Dale Carnegie
  </text>
  
  <!-- Footer emblem / branding -->
  <text x="300" y="500" text-anchor="middle" fill="#f5d0fe" font-family="Georgia, serif" font-size="12" letter-spacing="3" opacity="0.6">
    TIỂU VIỆN HỮU THƯ
  </text>
</svg>